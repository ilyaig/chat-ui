<div class="messages">
  @for (m of messages; track m.id) {
    <div class="bubble" [class.mine]="m.from === currentUsername">
      <div class="text">{{ m.text }}</div>
      <div class="meta">
        {{ m.createdAt | appTime }}
        @if (m.from === currentUsername) {
          <app-status-ticks [status]="m.status" />
        }
      </div>
    </div>
  }
</div>
