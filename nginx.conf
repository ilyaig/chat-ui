# Конфиг nginx для Angular-фронта в docker-контейнере.
# Слушаем 80 порт внутри контейнера, снаружи его открывает docker-compose (4200:80).

server {
    listen 80;
    server_name localhost;

    # Корень со статикой — совпадает с путём, куда кладёт сборку Dockerfile
    root /usr/share/nginx/html;
    index index.html;
    # --- Статика Angular ---
    location / {
        try_files $uri $uri/ /index.html;
        # try_files: сначала ищем физический файл, потом каталог,
        # иначе отдаём index.html — это SPA-fallback, чтобы работали
        # глубокие ссылки роутера (/chat, /login и т.п.) при перезагрузке страницы
    }

    # Кэширование ресурсов сборки: Angular кладёт в assets файлы
    # с хэш-именами, их можно кэшировать агрессивно и надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://chat-server:8080;
        # имя chat-server резолвится docker-compose по имени сервиса;
        # при локальном запуске без docker замените на localhost:8080

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Размер тела для POST /api/messages и регистрации — с запасом
        client_max_body_size 5m;
    }

    # --- SSE-эндпоинт: отдельный location с критичными настройками ---
    location /api/events {
        proxy_pass http://chat-server:8080/api/events;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # HTTP/1.1 нужен для chunked-потока SSE
        proxy_http_version 1.1;

        # Убираем keep-alive-заголовок: для стриминга соединение должно жить
        proxy_set_header Connection "";

        # ГЛАВНОЕ: без этого nginx буферизует весь поток —
        # события не приходят до закрытия соединения
        proxy_buffering off;

        # Отключаем кэш для стрима
        proxy_cache off;

        # Считаем SSE обычным ответом, а не запросом с телом
        chunked_transfer_encoding off;

        # Дефолтный read_timeout — 60 секунд простоя, и nginx разорвёт
        # соединение раньше, чем вы заметите. Heartbeat сервера каждые 15
        # секунд его обходит, но ставим час с запасом на длинные паузы
        proxy_read_timeout 3600s;

        # И на отправку тоже — на случай медленных клиентов
        proxy_send_timeout 3600s;
    }
}