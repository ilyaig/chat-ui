# Общий compose для фронтенда и сервера.
# Запуск из каталога chat-ui:  docker compose up --build
# Сервер должен лежать в соседнем каталоге ../chat-server.

services:
  # Фронт: nginx раздаёт статику и проксирует /api на сервер
  frontend:
    build: .
    ports:
      - "4200:80"
    depends_on:
      - chat-server
    networks:
      - app-net

  # Сервер
  chat-server:
    build: ../chat-server
    ports:
      - "8080:8080"
    environment:
      # Параметры БД сервер читает из переменных окружения
      DB_URL: jdbc:postgresql://db:5432/chat
      DB_USER: chat
      DB_PASSWORD: chat
    depends_on:
      - db
    networks:
      - app-net

  # PostgreSQL для пользователей и истории сообщений
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-net

volumes:
  pgdata:
networks:
  app-net:
    driver: bridge